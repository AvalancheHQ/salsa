name: macro-install-debug

# Compare authenticated vs unauthenticated cargo-binstall resolve on codspeed-macro.
# Hypothesis: install-action sets GITHUB_TOKEN, so binstall uses the GitHub API
# path, which is the slow one on this runner.

on:
  push:
    branches:
      - macro-install-debug
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-vs-noauth:
    name: "auth-vs-noauth (${{ matrix.runner }})"
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04-arm, codspeed-macro]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: binstall resolve — WITH token (install-action's exact invocation)
        shell: bash
        env:
          GH_TOKEN_VALUE: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            echo "::group::AUTH iteration $i"
            rm -f "$HOME/.cargo/bin/cargo-codspeed"
            start=$(date +%s.%N)
            GITHUB_TOKEN="$GH_TOKEN_VALUE" cargo binstall --force --no-confirm --locked --log-level debug cargo-codspeed 2>&1 || true
            end=$(date +%s.%N)
            echo "RESULT runner=${{ matrix.runner }} mode=auth iteration=$i seconds=$(awk "BEGIN{print $end-$start}")"
            echo "::endgroup::"
          done

      - name: binstall resolve — WITHOUT token
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "::group::NOAUTH iteration $i"
            rm -f "$HOME/.cargo/bin/cargo-codspeed"
            start=$(date +%s.%N)
            env -u GITHUB_TOKEN -u GH_TOKEN cargo binstall --force --no-confirm --locked --log-level debug cargo-codspeed 2>&1 || true
            end=$(date +%s.%N)
            echo "RESULT runner=${{ matrix.runner }} mode=noauth iteration=$i seconds=$(awk "BEGIN{print $end-$start}")"
            echo "::endgroup::"
          done
