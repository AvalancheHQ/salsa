name: macro-install-debug

# Probe api.github.com latency distribution from the macro runner vs a hosted
# runner. binstall's slow resolve is dominated by calls to this host; if the
# macro runner sees a latency tail, that is the root cause.

on:
  push:
    branches:
      - macro-install-debug
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-latency:
    name: "api-latency (${{ matrix.runner }})"
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04-arm, codspeed-macro]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Probe api.github.com (REST releases + GraphQL), 50x
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          rest="https://api.github.com/repos/CodSpeedHQ/codspeed-rust/releases/tags/5.0.1"
          gql="https://api.github.com/graphql"
          fmt='attempt=%{http_code} dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\n'

          echo "::group::REST releases/tags (authenticated), 50 calls, reusing nothing"
          for i in $(seq 1 50); do
            printf "REST i=%s " "$i"
            curl -sS -o /dev/null -w "$fmt" --max-time 60 \
              -H "Authorization: Bearer $TOKEN" \
              -H "User-Agent: latency-probe" "$rest"
          done
          echo "::endgroup::"

          echo "::group::GraphQL (authenticated), 50 calls"
          q='{"query":"query { repository(owner:\"CodSpeedHQ\",name:\"codspeed-rust\") { release(tagName:\"5.0.1\") { releaseAssets(first:100) { nodes { name } } } } }"}'
          for i in $(seq 1 50); do
            printf "GQL i=%s " "$i"
            curl -sS -o /dev/null -w "$fmt" --max-time 60 \
              -X POST -H "Authorization: Bearer $TOKEN" \
              -H "User-Agent: latency-probe" -d "$q" "$gql"
          done
          echo "::endgroup::"

          echo "::group::rate limit headers"
          curl -sS -D - -o /dev/null -H "Authorization: Bearer $TOKEN" -H "User-Agent: latency-probe" "$rest" | grep -i ratelimit || true
          echo "::endgroup::"
